name: Release

# Pushing a version tag (e.g. v1.2.0) builds, tests and publishes a GitHub Release. Installed copies
# of CodeLines read latest.yml from the newest published release to update themselves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Check the tag matches package.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify source
        run: npm run verify
      - name: Check CHANGELOG.md has notes for this version
        shell: bash
        run: npx tsx scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > /dev/null
      - name: Package without publishing
        run: npm run package
      - name: Test packaged desktop
        run: npm run test:desktop -- --packaged
      - name: Test portable executable
        run: npm run test:portable
      - name: Verify release checksums
        run: npm run checksums:verify
      - name: Write release notes from CHANGELOG.md
        shell: bash
        run: npx tsx scripts/release-notes.ts "${GITHUB_REF_NAME#v}" > release/RELEASE-NOTES.md
      - name: Upload release files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write to the repository, and it runs no project code.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release
          path: release
      - name: Create the release with the installer, update feed and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cd release
          test -f latest.yml
          gh release create "$TAG" --repo "$REPO" --title "CodeLines ${TAG#v}" \
            --notes-file RELEASE-NOTES.md --verify-tag \
            ./*.exe ./*.exe.blockmap latest.yml SHA256SUMS.txt
